name: Build SuperOrders

on:
  push:
    branches:
      - main
      - feature/superorders-foundation
  pull_request:
    branches:
      - main
      - feature/superorders-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: superorders-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test, and package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install PlaceholderAPI API from the official release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$RUNNER_TEMP/PlaceholderAPI-2.12.2.jar" \
            "https://github.com/PlaceholderAPI/PlaceholderAPI/releases/download/2.12.2/PlaceholderAPI-2.12.2.jar"
          mvn --batch-mode --no-transfer-progress org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file \
            -Dfile="$RUNNER_TEMP/PlaceholderAPI-2.12.2.jar" \
            -DgroupId=me.clip -DartifactId=placeholderapi -Dversion=2.12.2 \
            -Dpackaging=jar -DgeneratePom=true

      - name: Validate Maven project
        run: mvn --batch-mode --no-transfer-progress validate

      - name: Run tests and build plugin
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload plugin JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SuperOrders-${{ github.sha }}
          path: target/SuperOrders-*.jar
          if-no-files-found: error
          retention-days: 14
